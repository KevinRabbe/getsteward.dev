[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-data-platform-v01"
version = "0.1.0"
description = "Minimal immutable open-data ingest pipeline proof of concept"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
odp = "open_data_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
