name: Closed alpha publication authorization CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  publication-authorization:
    name: Prove conjunctive physical and live-host publication authorization
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run publication authorization promotion tests
        shell: pwsh
        run: |
          ./tools/test-closed-alpha-publication-authorization.ps1
