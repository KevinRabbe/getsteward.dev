name: Windows acceptance package

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  package:
    name: Build Windows acceptance package
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build byte-verifiable package
        shell: pwsh
        run: |
          ./tools/e4-build-desktop.ps1 `
            -FrameworkDependent `
            -OutputDirectory "$env:RUNNER_TEMP/steward-windows-acceptance"
          Get-Content "$env:RUNNER_TEMP/steward-windows-acceptance/acceptance-build.json"

      - name: Upload exact acceptance package
        uses: actions/upload-artifact@v6
        with:
          name: steward-windows-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/steward-windows-acceptance
          if-no-files-found: error
          retention-days: 14
