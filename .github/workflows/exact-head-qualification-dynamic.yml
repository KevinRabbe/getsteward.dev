name: Peer exact-head qualification

on:
  pull_request:

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  qualify:
    name: Aggregate exact-head peer-product qualification
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Observe peer-product workflow groups and publish one status
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_EVIDENCE_PATH: ${{ runner.temp }}/peer-exact-head-qualification.json
          QUALIFICATION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          QUALIFICATION_EVENT: pull_request
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $targetSha = [string]$env:QUALIFICATION_HEAD_SHA
          $targetEvent = [string]$env:QUALIFICATION_EVENT
          if ($targetSha -notmatch '^[0-9a-f]{40}$') { throw 'Qualification head SHA is malformed.' }
          if ($targetEvent -cne 'pull_request') { throw 'Qualification event is unsupported.' }

          $expectedNames = @(
            'Peer product CI',
            'Windows acceptance package',
            'Palworld read-only CI',
            '7 Days to Die adapter CI',
            'Project Zomboid adapter CI'
          )
          $expectedCount = $expectedNames.Count
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $runsUri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs?head_sha=$targetSha&event=$targetEvent&per_page=100"
          $statusUri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/statuses/$targetSha"
          $observerUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $deadline = [DateTimeOffset]::UtcNow.AddMinutes(30)
          $selected = @{}
          $failureReason = $null

          try {
            $pendingBody = [ordered]@{
              state = 'pending'
              context = 'safe-world/exact-head-qualification-v2'
              description = "Waiting for all $expectedCount peer-product workflow groups."
              target_url = $observerUrl
            } | ConvertTo-Json -Compress
            Invoke-RestMethod -Method Post -Uri $statusUri -Headers $headers -Body $pendingBody -ContentType 'application/json' | Out-Null

            do {
              $response = Invoke-RestMethod -Method Get -Uri $runsUri -Headers $headers
              $matching = @($response.workflow_runs | Where-Object {
                [string]$_.head_sha -ceq $targetSha -and [string]$_.event -ceq $targetEvent
              })

              $selected = @{}
              foreach ($name in $expectedNames) {
                $candidates = @($matching | Where-Object { [string]$_.name -ceq $name } | Sort-Object id -Descending)
                if ($candidates.Count -gt 0) { $selected[$name] = $candidates[0] }
              }

              $presentCount = $selected.Count
              $completedCount = @($selected.Values | Where-Object { [string]$_.status -ceq 'completed' }).Count
              Write-Host "Peer exact-head qualification: $presentCount/$expectedCount present, $completedCount/$expectedCount completed."
              foreach ($name in $expectedNames) {
                if ($selected.ContainsKey($name)) {
                  $run = $selected[$name]
                  Write-Host "  ${name}: $($run.status) / $($run.conclusion) / $($run.id)"
                }
                else {
                  Write-Host "  ${name}: not registered"
                }
              }

              if ($presentCount -eq $expectedCount -and $completedCount -eq $expectedCount) { break }
              Start-Sleep -Seconds 15
            } while ([DateTimeOffset]::UtcNow -lt $deadline)

            if ($selected.Count -ne $expectedCount) {
              $missing = @($expectedNames | Where-Object { -not $selected.ContainsKey($_) })
              $failureReason = "Missing exact-head peer workflow runs: $($missing -join ', ')"
            }
            else {
              $incomplete = @($expectedNames | Where-Object { [string]$selected[$_].status -cne 'completed' })
              if ($incomplete.Count -gt 0) {
                $failureReason = "Peer workflow runs did not complete: $($incomplete -join ', ')"
              }
              else {
                $failed = @($expectedNames | Where-Object { [string]$selected[$_].conclusion -cne 'success' })
                if ($failed.Count -gt 0) { $failureReason = "Peer workflow runs were not successful: $($failed -join ', ')" }
              }
            }
          }
          catch {
            $failureReason = "Peer qualification observer failed: $($_.Exception.Message)"
          }

          $groups = @()
          foreach ($name in $expectedNames) {
            if ($selected.ContainsKey($name)) {
              $run = $selected[$name]
              $groups += [ordered]@{
                name = $name
                runId = [int64]$run.id
                event = [string]$run.event
                headSha = [string]$run.head_sha
                status = [string]$run.status
                conclusion = [string]$run.conclusion
                htmlUrl = [string]$run.html_url
              }
            }
            else {
              $groups += [ordered]@{
                name = $name
                runId = $null
                event = $targetEvent
                headSha = $targetSha
                status = 'missing'
                conclusion = $null
                htmlUrl = $null
              }
            }
          }

          $succeeded = [string]::IsNullOrWhiteSpace($failureReason)
          $evidence = [ordered]@{
            documentType = 'steward.peer-exact-head-qualification'
            schemaVersion = 1
            observedAtUtc = [DateTimeOffset]::UtcNow.ToString('O')
            repository = $env:GITHUB_REPOSITORY
            event = $targetEvent
            headSha = $targetSha
            observerRunId = [int64]$env:GITHUB_RUN_ID
            qualificationBoundary = 'normal-peer-product-only'
            expectedWorkflowGroupCount = $expectedCount
            allPresent = ($selected.Count -eq $expectedCount)
            allCompleted = ($selected.Count -eq $expectedCount -and @($selected.Values | Where-Object { [string]$_.status -cne 'completed' }).Count -eq 0)
            allSucceeded = $succeeded
            failureReason = $failureReason
            workflowGroups = $groups
          }
          [IO.File]::WriteAllText(
            $env:QUALIFICATION_EVIDENCE_PATH,
            ($evidence | ConvertTo-Json -Depth 7),
            [Text.UTF8Encoding]::new($false))

          $state = if ($succeeded) { 'success' } else { 'failure' }
          $description = if ($succeeded) {
            "All $expectedCount peer-product workflow groups are green."
          }
          else {
            $text = [string]$failureReason
            if ($text.Length -gt 140) { $text.Substring(0, 140) } else { $text }
          }
          $statusBody = [ordered]@{
            state = $state
            context = 'safe-world/exact-head-qualification-v2'
            description = $description
            target_url = $observerUrl
          } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Uri $statusUri -Headers $headers -Body $statusBody -ContentType 'application/json' | Out-Null

          Get-Content -LiteralPath $env:QUALIFICATION_EVIDENCE_PATH
          if (-not $succeeded) { throw $failureReason }

      - name: Upload peer exact-head qualification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: peer-exact-head-qualification-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/peer-exact-head-qualification.json
          if-no-files-found: warn
          retention-days: 14
