name: Closed alpha live ingress activation CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  ingress-activation:
    name: Prove managed Caddy activation after exact backend deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install managed Caddy and SSH server
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends caddy openssh-server
          caddy version
          /usr/sbin/sshd -V 2>&1 || true

      - name: Run live ingress activation integration rehearsal
        shell: pwsh
        run: |
          ./tools/test-closed-alpha-live-ingress-activation.ps1
