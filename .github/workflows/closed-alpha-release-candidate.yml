name: Closed alpha release candidate

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Real HTTPS Steward backend URL for an operator release candidate"
        required: false
        type: string
      version:
        description: "Closed-alpha candidate version"
        required: false
        default: "2.0.0-alpha.2"
        type: string

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  desktop:
    name: Build exact Windows Friends Build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build byte-verifiable Desktop ZIP
        shell: pwsh
        env:
          REQUESTED_API_BASE_URL: ${{ github.event.inputs.api_base_url }}
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          $apiBaseUrl = $env:REQUESTED_API_BASE_URL
          if ([string]::IsNullOrWhiteSpace($apiBaseUrl)) {
            $apiBaseUrl = 'https://closed-alpha.example.invalid/'
          }
          $version = $env:REQUESTED_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = '2.0.0-ci'
          }

          ./tools/v2-build-friends.ps1 `
            -ApiBaseUrl $apiBaseUrl `
            -Version $version `
            -OutputDirectory "$env:RUNNER_TEMP/closed-alpha-desktop"

      - name: Upload Desktop staging artifact
        uses: actions/upload-artifact@v6
        with:
          name: closed-alpha-desktop-input
          path: ${{ runner.temp }}/closed-alpha-desktop
          if-no-files-found: error
          retention-days: 2

  backend:
    name: Build exact Linux backend image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build, inspect, and save backend image
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          $version = $env:REQUESTED_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = '2.0.0-ci'
          }
          if ($version -notmatch '^[0-9A-Za-z][0-9A-Za-z.-]{0,63}$') {
            throw 'Closed-alpha version is malformed.'
          }

          $tagVersion = $version.ToLowerInvariant()
          if ($tagVersion -notmatch '^[a-z0-9][a-z0-9._-]{0,63}$') {
            throw 'Closed-alpha version cannot form a safe backend tag.'
          }
          $imageTag = "steward-backend:$tagVersion"
          $output = "$env:RUNNER_TEMP/closed-alpha-backend"
          New-Item -ItemType Directory -Force -Path $output | Out-Null

          docker build `
            --platform linux/amd64 `
            --file src/SharedWorlds.Backend.Api/Dockerfile `
            --tag $imageTag `
            --label "org.opencontainers.image.revision=${{ github.sha }}" `
            --label "org.opencontainers.image.version=$version" `
            .
          if ($LASTEXITCODE -ne 0) {
            throw "Backend image build failed with exit code $LASTEXITCODE."
          }

          $imageId = (docker image inspect $imageTag --format '{{.Id}}').Trim().ToLowerInvariant()
          $runtimeUser = (docker image inspect $imageTag --format '{{.Config.User}}').Trim()
          $platform = (docker image inspect $imageTag --format '{{.Os}}/{{.Architecture}}').Trim().ToLowerInvariant()
          if ($imageId -notmatch '^sha256:[0-9a-f]{64}$') {
            throw 'Backend image ID is malformed.'
          }
          if (-not [string]::Equals($runtimeUser, 'app', [StringComparison]::Ordinal)) {
            throw "Backend image runtime user is '$runtimeUser', expected 'app'."
          }
          if (-not [string]::Equals($platform, 'linux/amd64', [StringComparison]::Ordinal)) {
            throw "Backend image platform is '$platform', expected linux/amd64."
          }

          $tarPath = Join-Path $output 'backend-image.tar'
          docker save --output $tarPath $imageTag
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $tarPath)) {
            throw 'Backend image TAR was not created.'
          }

          $metadata = [ordered]@{
            imageTag = $imageTag
          }
          [IO.File]::WriteAllText(
            (Join-Path $output 'backend-metadata.json'),
            ($metadata | ConvertTo-Json -Compress),
            [Text.UTF8Encoding]::new($false))

      - name: Upload backend staging artifact
        uses: actions/upload-artifact@v6
        with:
          name: closed-alpha-backend-input
          path: ${{ runner.temp }}/closed-alpha-backend
          if-no-files-found: error
          retention-days: 2

  assemble:
    name: Assemble and verify deferred release candidate
    needs:
      - desktop
      - backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Desktop staging artifact
        uses: actions/download-artifact@v6
        with:
          name: closed-alpha-desktop-input
          path: ${{ runner.temp }}/closed-alpha-desktop

      - name: Download backend staging artifact
        uses: actions/download-artifact@v6
        with:
          name: closed-alpha-backend-input
          path: ${{ runner.temp }}/closed-alpha-backend

      - name: Assemble exact release candidate
        shell: pwsh
        env:
          REQUESTED_API_BASE_URL: ${{ github.event.inputs.api_base_url }}
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          $apiBaseUrl = $env:REQUESTED_API_BASE_URL
          if ([string]::IsNullOrWhiteSpace($apiBaseUrl)) {
            $apiBaseUrl = 'https://closed-alpha.example.invalid/'
          }
          $version = $env:REQUESTED_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = '2.0.0-ci'
          }

          $backendMetadataPath = "$env:RUNNER_TEMP/closed-alpha-backend/backend-metadata.json"
          $backendMetadata = Get-Content -LiteralPath $backendMetadataPath -Raw | ConvertFrom-Json
          $metadataProperties = @($backendMetadata.PSObject.Properties.Name)
          if ($metadataProperties.Count -ne 1 -or $metadataProperties[0] -cne 'imageTag') {
            throw 'Backend staging metadata contains missing or unexpected fields.'
          }
          $output = "$env:RUNNER_TEMP/safe-world-closed-alpha-release"

          ./tools/assemble-closed-alpha-release.ps1 `
            -ApiBaseUrl $apiBaseUrl `
            -Version $version `
            -CommitSha '${{ github.sha }}' `
            -DesktopInputDirectory "$env:RUNNER_TEMP/closed-alpha-desktop" `
            -BackendTarPath "$env:RUNNER_TEMP/closed-alpha-backend/backend-image.tar" `
            -BackendImageTag ([string]$backendMetadata.imageTag) `
            -OutputDirectory $output

          ./tools/finalize-closed-alpha-deployment-plan.ps1 `
            -BundleDirectory $output

          ./tools/verify-closed-alpha-release.ps1 -BundleDirectory $output

          $manifestPath = Join-Path $output 'release-manifest.json'
          $originalManifestBytes = [IO.File]::ReadAllBytes($manifestPath)
          try {
            $unauthorizedPromotion = [Text.Encoding]::UTF8.GetString($originalManifestBytes) | ConvertFrom-Json
            $unauthorizedPromotion.publishAuthorization.physicalBringHere = 'passed'
            $unauthorizedPromotion.publishAuthorization.publishAllowed = $true
            [IO.File]::WriteAllText(
              $manifestPath,
              ($unauthorizedPromotion | ConvertTo-Json -Depth 6),
              [Text.UTF8Encoding]::new($false))

            $unauthorizedPromotionRejected = $false
            try {
              ./tools/verify-closed-alpha-release.ps1 `
                -BundleDirectory $output `
                -RequirePublishAuthorized
            }
            catch {
              $unauthorizedPromotionRejected = $true
              Write-Host "[EXPECTED] Boolean-only publish promotion rejected: $($_.Exception.Message)"
            }
            if (-not $unauthorizedPromotionRejected) {
              throw 'Boolean-only publish promotion was accepted without physical evidence.'
            }
          }
          finally {
            [IO.File]::WriteAllBytes($manifestPath, $originalManifestBytes)
          }

          $statusPath = Join-Path $output 'RELEASE-STATUS.txt'
          $originalStatusBytes = [IO.File]::ReadAllBytes($statusPath)
          try {
            Add-Content -LiteralPath $statusPath -Value 'tampered'
            $statusTamperRejected = $false
            try {
              ./tools/verify-closed-alpha-release.ps1 -BundleDirectory $output
            }
            catch {
              $statusTamperRejected = $true
              Write-Host "[EXPECTED] Artifact tamper rejected: $($_.Exception.Message)"
            }
            if (-not $statusTamperRejected) {
              throw 'Modified release status passed byte verification.'
            }
          }
          finally {
            [IO.File]::WriteAllBytes($statusPath, $originalStatusBytes)
          }

          ./tools/verify-closed-alpha-release.ps1 -BundleDirectory $output

          $strictGateBlocked = $false
          try {
            ./tools/verify-closed-alpha-release.ps1 `
              -BundleDirectory $output `
              -RequirePublishAuthorized
          }
          catch {
            $strictGateBlocked = $true
            Write-Host "[EXPECTED] Strict publish gate remains blocked: $($_.Exception.Message)"
          }
          if (-not $strictGateBlocked) {
            throw 'Deferred physical Bring Here evidence unexpectedly produced a publish-authorized bundle.'
          }

          Get-Content -LiteralPath $manifestPath
          Get-Content -LiteralPath $statusPath

      - name: Upload exact deferred closed-alpha candidate
        uses: actions/upload-artifact@v6
        with:
          name: safe-world-closed-alpha-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/safe-world-closed-alpha-release
          if-no-files-found: error
          retention-days: 14

  rehearse:
    name: Rehearse exact bundled backend deployment
    needs:
      - assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v6

      - name: Download exact assembled candidate
        uses: actions/download-artifact@v6
        with:
          name: safe-world-closed-alpha-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/safe-world-closed-alpha-release

      - name: Prove bundled deployment planner without repository dependency
        shell: pwsh
        run: |
          $bundle = "$env:RUNNER_TEMP/safe-world-closed-alpha-release"
          $planner = Join-Path $bundle 'prepare-closed-alpha-deployment.ps1'
          if (-not [IO.File]::Exists($planner)) {
            throw 'Downloaded release candidate is missing its bundled deployment planner.'
          }

          $manifestPath = Join-Path $bundle 'release-manifest.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $plannerEntries = @($manifest.artifacts | Where-Object {
            [string]$_.path -ceq 'prepare-closed-alpha-deployment.ps1'
          })
          if ($plannerEntries.Count -ne 1) {
            throw 'Release manifest does not contain exactly one deployment planner.'
          }
          $plannerHash = (Get-FileHash -LiteralPath $planner -Algorithm SHA256).Hash
          if ([string]$plannerEntries[0].sha256 -cne $plannerHash) {
            throw 'Bundled deployment planner does not match release-manifest.json.'
          }

          $environmentPath = "$env:RUNNER_TEMP/bundled-backend.env"
          $environment = @'
          PORT=8080
          ConnectionStrings__Steward=Host=postgres.private.example;Database=steward;Username=steward_operator;Password=synthetic-postgres-password-12345;SSL Mode=VerifyFull;Trust Server Certificate=false
          ObjectStorage__ServiceUrl=https://s3.fr-par.scw.cloud/
          ObjectStorage__AuthenticationRegion=fr-par
          ObjectStorage__BucketName=steward-closed-alpha
          ObjectStorage__AccessKeyId=SYNTHETICACCESSKEY123
          ObjectStorage__SecretAccessKey=synthetic-object-storage-secret-key-123456789
          ObjectStorage__ForcePathStyle=false
          FriendsBuild__Enabled=true
          FriendsBuild__Identities__0__Id=friend-alpha
          FriendsBuild__Identities__0__DisplayName=Friend Alpha
          FriendsBuild__Identities__0__CredentialSha256=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          ReverseProxy__KnownProxyIp=127.0.0.1
          Cleanup__IntervalMinutes=15
          Cleanup__VerifiedCandidateRetentionDays=7
          Cleanup__BatchSize=100
          '@
          [IO.File]::WriteAllText(
            $environmentPath,
            $environment,
            [Text.UTF8Encoding]::new($false))

          $output = "$env:RUNNER_TEMP/bundled-deployment-plan"
          & $planner `
            -BundleDirectory $bundle `
            -EnvironmentFile $environmentPath `
            -OutputDirectory $output

          $plan = Get-Content -LiteralPath (Join-Path $output 'deployment-plan.json') -Raw | ConvertFrom-Json
          if ([string]$plan.release.commitSha -cne [string]$manifest.commitSha -or
              [string]$plan.release.backendImageId -cne [string]$manifest.deployment.backendImageId) {
            throw 'Bundled deployment plan is not bound to the downloaded candidate identity.'
          }
          if ([bool]$plan.configuration.secretValuesCopied) {
            throw 'Bundled deployment plan claims that secret values were copied.'
          }

          bash -n (Join-Path $output 'deploy-exact-candidate.sh')
          if ($LASTEXITCODE -ne 0) {
            throw 'Bundled deployment script has invalid Bash syntax.'
          }
          bash -n (Join-Path $output 'verify-public-https.sh')
          if ($LASTEXITCODE -ne 0) {
            throw 'Bundled public HTTPS verifier has invalid Bash syntax.'
          }

          $combinedOutput = (Get-ChildItem -LiteralPath $output -File |
            ForEach-Object { [IO.File]::ReadAllText($_.FullName) }) -join "`n"
          foreach ($secret in @(
            'synthetic-postgres-password-12345',
            'SYNTHETICACCESSKEY123',
            'synthetic-object-storage-secret-key-123456789',
            'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA'
          )) {
            if ($combinedOutput.Contains($secret, [StringComparison]::Ordinal)) {
              throw 'Bundled deployment planner leaked a supplied secret or identity digest.'
            }
          }

          if ([bool]$plan.deployability.deployable) {
            & $planner `
              -BundleDirectory $bundle `
              -EnvironmentFile $environmentPath `
              -OutputDirectory "$env:RUNNER_TEMP/bundled-deployment-plan-strict" `
              -RequireDeployable
          }
          else {
            $strictBlocked = $false
            try {
              & $planner `
                -BundleDirectory $bundle `
                -EnvironmentFile $environmentPath `
                -OutputDirectory "$env:RUNNER_TEMP/bundled-deployment-plan-strict" `
                -RequireDeployable
            }
            catch {
              $strictBlocked = $true
              Write-Host "[EXPECTED] Manifest API coordinate remains non-deployable: $($_.Exception.Message)"
            }
            if (-not $strictBlocked) {
              throw 'Bundled planner did not enforce its manifest-derived deployment state.'
            }
          }

      - name: Deploy, authenticate, and prove rollback without rebuild
        shell: pwsh
        run: |
          ./tools/rehearse-closed-alpha-deployment.ps1 `
            -BundleDirectory "$env:RUNNER_TEMP/safe-world-closed-alpha-release" `
            -EvidencePath "$env:RUNNER_TEMP/closed-alpha-deployment-rehearsal.json"

      - name: Upload deployment rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: closed-alpha-deployment-rehearsal-${{ github.sha }}
          path: ${{ runner.temp }}/closed-alpha-deployment-rehearsal.json
          if-no-files-found: warn
          retention-days: 14

  rehearse-https:
    name: Rehearse exact candidate behind HTTPS ingress
    needs:
      - rehearse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v6

      - name: Download exact assembled candidate
        uses: actions/download-artifact@v6
        with:
          name: safe-world-closed-alpha-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/safe-world-closed-alpha-release

      - name: Prove Caddy TLS and authenticated API access without rebuild
        shell: pwsh
        run: |
          ./tools/rehearse-closed-alpha-https-ingress.ps1 `
            -BundleDirectory "$env:RUNNER_TEMP/safe-world-closed-alpha-release" `
            -EvidencePath "$env:RUNNER_TEMP/closed-alpha-https-ingress-rehearsal.json"

      - name: Upload HTTPS ingress rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: closed-alpha-https-ingress-rehearsal-${{ github.sha }}
          path: ${{ runner.temp }}/closed-alpha-https-ingress-rehearsal.json
          if-no-files-found: warn
          retention-days: 14
