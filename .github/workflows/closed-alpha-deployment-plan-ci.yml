name: Closed alpha deployment plan CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  deployment-plan:
    name: Validate fail-closed operator deployment plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build strict synthetic release inputs
        shell: pwsh
        run: |
          $bundle = "$env:RUNNER_TEMP/closed-alpha-plan-bundle"
          $backend = Join-Path $bundle 'backend'
          New-Item -ItemType Directory -Force -Path $backend | Out-Null
          [IO.File]::WriteAllText(
            (Join-Path $backend 'steward-backend-2.0.0-ci-linux-amd64.tar'),
            'synthetic backend tar for deployment-plan contract tests',
            [Text.UTF8Encoding]::new($false))

          $verifier = @'
          param([Parameter(Mandatory = $true)][string]$BundleDirectory)
          Set-StrictMode -Version Latest
          $manifest = Join-Path ([IO.Path]::GetFullPath($BundleDirectory)) 'release-manifest.json'
          if (-not [IO.File]::Exists($manifest)) {
              throw 'Synthetic release manifest is missing.'
          }
          '@
          [IO.File]::WriteAllText(
            (Join-Path $bundle 'verify-closed-alpha-release.ps1'),
            $verifier,
            [Text.UTF8Encoding]::new($false))

          $tarPath = Join-Path $backend 'steward-backend-2.0.0-ci-linux-amd64.tar'
          $manifest = [ordered]@{
            documentType = 'steward.closed-alpha-release-candidate'
            schemaVersion = 1
            channel = 'closed-alpha'
            version = '2.0.0-ci'
            commitSha = '0123456789abcdef0123456789abcdef01234567'
            builtAtUtc = [DateTimeOffset]::UtcNow.ToString('O')
            deployment = [ordered]@{
              apiBaseUrl = 'https://closed-alpha.example.invalid/'
              authenticationMode = 'friends-build'
              backendImageTag = 'steward-backend:2.0.0-ci'
              backendImageId = 'sha256:' + ('a' * 64)
              backendRuntimeUser = 'app'
              targetPlatform = 'linux/amd64'
              postgresMajorVersion = 17
              objectStorageProtocol = 's3-compatible'
            }
            publishAuthorization = [ordered]@{
              physicalBringHere = 'deferred'
              publishAllowed = $false
              reason = 'Synthetic qualification candidate.'
              evidencePath = $null
              evidenceSha256 = $null
            }
            artifacts = @(
              [ordered]@{
                path = 'backend/steward-backend-2.0.0-ci-linux-amd64.tar'
                byteSize = (Get-Item -LiteralPath $tarPath).Length
                sha256 = (Get-FileHash -LiteralPath $tarPath -Algorithm SHA256).Hash
              }
            )
          }
          [IO.File]::WriteAllText(
            (Join-Path $bundle 'release-manifest.json'),
            ($manifest | ConvertTo-Json -Depth 8),
            [Text.UTF8Encoding]::new($false))

          $environment = @'
          PORT=8080
          ConnectionStrings__Steward=Host=postgres.private.example;Database=steward;Username=steward_operator;Password=synthetic-postgres-password-12345;SSL Mode=VerifyFull;Trust Server Certificate=false
          ObjectStorage__ServiceUrl=https://s3.fr-par.scw.cloud/
          ObjectStorage__AuthenticationRegion=fr-par
          ObjectStorage__BucketName=steward-closed-alpha
          ObjectStorage__AccessKeyId=SYNTHETICACCESSKEY123
          ObjectStorage__SecretAccessKey=synthetic-object-storage-secret-key-123456789
          ObjectStorage__ForcePathStyle=false
          FriendsBuild__Enabled=true
          FriendsBuild__Identities__0__Id=friend-alpha
          FriendsBuild__Identities__0__DisplayName=Friend Alpha
          FriendsBuild__Identities__0__CredentialSha256=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          ReverseProxy__KnownProxyIp=127.0.0.1
          Cleanup__IntervalMinutes=15
          Cleanup__VerifiedCandidateRetentionDays=7
          Cleanup__BatchSize=100
          '@
          [IO.File]::WriteAllText(
            "$env:RUNNER_TEMP/backend.env",
            $environment,
            [Text.UTF8Encoding]::new($false))

      - name: Prove blocked and deployable plan states
        shell: pwsh
        run: |
          $bundle = "$env:RUNNER_TEMP/closed-alpha-plan-bundle"
          $environment = "$env:RUNNER_TEMP/backend.env"
          $blockedOutput = "$env:RUNNER_TEMP/deployment-plan-blocked"
          ./tools/prepare-closed-alpha-deployment.ps1 `
            -BundleDirectory $bundle `
            -EnvironmentFile $environment `
            -OutputDirectory $blockedOutput

          $blockedPlan = Get-Content -LiteralPath (Join-Path $blockedOutput 'deployment-plan.json') -Raw | ConvertFrom-Json
          if ([bool]$blockedPlan.deployability.deployable) {
            throw 'Reserved API host unexpectedly produced a deployable plan.'
          }
          if ([bool]$blockedPlan.configuration.secretValuesCopied) {
            throw 'Deployment plan claims that secret values were copied.'
          }

          $strictBlocked = $false
          try {
            ./tools/prepare-closed-alpha-deployment.ps1 `
              -BundleDirectory $bundle `
              -EnvironmentFile $environment `
              -OutputDirectory "$env:RUNNER_TEMP/deployment-plan-strict-blocked" `
              -RequireDeployable
          }
          catch {
            $strictBlocked = $true
            Write-Host "[EXPECTED] Reserved API host blocked: $($_.Exception.Message)"
          }
          if (-not $strictBlocked) {
            throw 'RequireDeployable accepted a reserved API host.'
          }

          $manifestPath = Join-Path $bundle 'release-manifest.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $manifest.deployment.apiBaseUrl = 'https://alpha.getsteward.dev/'
          [IO.File]::WriteAllText(
            $manifestPath,
            ($manifest | ConvertTo-Json -Depth 8),
            [Text.UTF8Encoding]::new($false))

          $readyOutput = "$env:RUNNER_TEMP/deployment-plan-ready"
          ./tools/prepare-closed-alpha-deployment.ps1 `
            -BundleDirectory $bundle `
            -EnvironmentFile $environment `
            -OutputDirectory $readyOutput `
            -RequireDeployable

          $readyPlan = Get-Content -LiteralPath (Join-Path $readyOutput 'deployment-plan.json') -Raw | ConvertFrom-Json
          if (-not [bool]$readyPlan.deployability.deployable) {
            throw 'Real DNS API host did not produce a deployable plan.'
          }
          if ([string]$readyPlan.host.apiHost -cne 'alpha.getsteward.dev') {
            throw 'Deployment plan API host is incorrect.'
          }

          bash -n (Join-Path $readyOutput 'deploy-exact-candidate.sh')
          if ($LASTEXITCODE -ne 0) {
            throw 'Generated backend deployment script has invalid Bash syntax.'
          }
          bash -n (Join-Path $readyOutput 'verify-public-https.sh')
          if ($LASTEXITCODE -ne 0) {
            throw 'Generated public HTTPS verifier has invalid Bash syntax.'
          }

          $combinedOutput = (Get-ChildItem -LiteralPath $readyOutput -File |
            ForEach-Object { [IO.File]::ReadAllText($_.FullName) }) -join "`n"
          foreach ($secret in @(
            'synthetic-postgres-password-12345',
            'SYNTHETICACCESSKEY123',
            'synthetic-object-storage-secret-key-123456789',
            'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA'
          )) {
            if ($combinedOutput.Contains($secret, [StringComparison]::Ordinal)) {
              throw 'Generated deployment plan leaked a supplied secret or identity digest.'
            }
          }

      - name: Prove unsafe environment variants fail closed
        shell: pwsh
        run: |
          $bundle = "$env:RUNNER_TEMP/closed-alpha-plan-bundle"
          $original = [IO.File]::ReadAllText("$env:RUNNER_TEMP/backend.env")
          $cases = @(
            @{
              Name = 'postgres-tls-downgrade'
              Text = $original.Replace('SSL Mode=VerifyFull', 'SSL Mode=Require')
            },
            @{
              Name = 'http-object-storage'
              Text = $original.Replace('https://s3.fr-par.scw.cloud/', 'http://s3.fr-par.scw.cloud/')
            },
            @{
              Name = 'steam-configuration'
              Text = $original + "`nSteam__PublisherKey=forbidden"
            },
            @{
              Name = 'broad-forwarded-headers'
              Text = $original + "`nASPNETCORE_FORWARDEDHEADERS_ENABLED=true"
            }
          )

          foreach ($case in $cases) {
            $environmentPath = "$env:RUNNER_TEMP/$($case.Name).env"
            [IO.File]::WriteAllText(
              $environmentPath,
              [string]$case.Text,
              [Text.UTF8Encoding]::new($false))
            $rejected = $false
            try {
              ./tools/prepare-closed-alpha-deployment.ps1 `
                -BundleDirectory $bundle `
                -EnvironmentFile $environmentPath `
                -OutputDirectory "$env:RUNNER_TEMP/rejected-$($case.Name)"
            }
            catch {
              $rejected = $true
              Write-Host "[EXPECTED] $($case.Name) rejected: $($_.Exception.Message)"
            }
            if (-not $rejected) {
              throw "Unsafe deployment case '$($case.Name)' was accepted."
            }
          }

      - name: Upload non-secret deployment plans
        uses: actions/upload-artifact@v6
        with:
          name: closed-alpha-deployment-plan-${{ github.sha }}
          path: |
            ${{ runner.temp }}/deployment-plan-blocked
            ${{ runner.temp }}/deployment-plan-ready
          if-no-files-found: error
          retention-days: 14
