name: Closed alpha live deployment request CI

on:
  pull_request:
  push:
    branches:
      - "agent/**"

permissions:
  contents: read

jobs:
  contract:
    name: Prove fail-closed live deployment request contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run contract tests
        shell: pwsh
        run: ./tools/test-closed-alpha-live-deployment-request.ps1
