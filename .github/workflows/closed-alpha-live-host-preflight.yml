name: Closed alpha live host preflight CI

on:
  pull_request:
  push:
    branches:
      - "agent/**"

permissions:
  contents: read

jobs:
  preflight:
    name: Prove read-only live-host preflight contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install disposable SSH server
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server

      - name: Run live-host preflight integration rehearsal
        shell: pwsh
        run: ./tools/test-closed-alpha-live-host-preflight.ps1
