name: Palworld PlM probe CI

on:
  push:
    branches:
      - "agent/palworld-runtime-overlay"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  probe:
    name: Build PlM probe and Palworld tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore probe
        run: dotnet restore tools/SharedWorlds.PalworldWorldOptionPlMProbe/SharedWorlds.PalworldWorldOptionPlMProbe.csproj

      - name: Build probe
        run: dotnet build tools/SharedWorlds.PalworldWorldOptionPlMProbe/SharedWorlds.PalworldWorldOptionPlMProbe.csproj --configuration Release --no-restore --nologo --verbosity minimal

      - name: Test Palworld adapter
        run: dotnet test tests/SharedWorlds.GameAdapters.Palworld.Tests/SharedWorlds.GameAdapters.Palworld.Tests.csproj --configuration Release --nologo --verbosity minimal
