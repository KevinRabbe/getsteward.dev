name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: |
          dotnet restore SharedWorlds.sln
          dotnet restore tests/SharedWorlds.Backend.PostgreSql.Tests/SharedWorlds.Backend.PostgreSql.Tests.csproj

      - name: Verify formatting
        run: |
          dotnet format SharedWorlds.sln --verify-no-changes --no-restore
          dotnet format tests/SharedWorlds.Backend.PostgreSql.Tests/SharedWorlds.Backend.PostgreSql.Tests.csproj --verify-no-changes --no-restore

  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore SharedWorlds.sln

      - name: Build
        shell: pwsh
        run: |
          dotnet build SharedWorlds.sln --configuration Release --no-restore --nologo --verbosity minimal *> build.log
          $buildExitCode = $LASTEXITCODE
          Get-Content build.log
          exit $buildExitCode

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-log-${{ matrix.os }}
          path: build.log
          if-no-files-found: error
          retention-days: 7

      - name: Test
        shell: pwsh
        run: |
          dotnet test SharedWorlds.sln --configuration Release --no-build --nologo --verbosity minimal --logger "trx;LogFileName=test-results.trx" *> test.log
          $testExitCode = $LASTEXITCODE
          Get-Content test.log
          exit $testExitCode

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-log-${{ matrix.os }}
          path: test.log
          if-no-files-found: ignore
          retention-days: 7

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: steward
          POSTGRES_PASSWORD: steward
          POSTGRES_DB: steward_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U steward -d steward_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STEWARD_TEST_POSTGRES: Host=localhost;Port=5432;Username=steward;Password=steward;Database=steward_test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore PostgreSQL integration tests
        run: dotnet restore tests/SharedWorlds.Backend.PostgreSql.Tests/SharedWorlds.Backend.PostgreSql.Tests.csproj

      - name: Test PostgreSQL persistence
        run: >-
          dotnet test tests/SharedWorlds.Backend.PostgreSql.Tests/SharedWorlds.Backend.PostgreSql.Tests.csproj
          --configuration Release
          --no-restore
          --nologo
          --verbosity minimal
