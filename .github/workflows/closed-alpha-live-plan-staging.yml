name: Closed alpha live plan staging CI

on:
  pull_request:
  push:
    branches:
      - "agent/**"

permissions:
  contents: read

jobs:
  staging:
    name: Prove preflight-gated live plan staging boundary
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install disposable SSH server
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server

      - name: Run live plan staging integration rehearsal
        shell: pwsh
        run: ./tools/test-closed-alpha-live-host-preflight.ps1 -RunPlanStaging
