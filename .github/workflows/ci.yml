name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore SharedWorlds.sln

      - name: Capture formatting diff
        shell: bash
        run: |
          dotnet format SharedWorlds.sln --no-restore
          git diff --name-only
          git diff --binary > format.diff
          test ! -s format.diff

      - name: Upload formatting diff
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: format-diff
          path: format.diff
          if-no-files-found: ignore
          retention-days: 1

  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore SharedWorlds.sln

      - name: Build
        shell: pwsh
        run: |
          dotnet build SharedWorlds.sln --configuration Release --no-restore --nologo --verbosity minimal *> build.log
          $buildExitCode = $LASTEXITCODE
          Get-Content build.log
          exit $buildExitCode

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-log-${{ matrix.os }}
          path: build.log
          if-no-files-found: error
          retention-days: 7

      - name: Test
        shell: pwsh
        run: |
          dotnet test SharedWorlds.sln --configuration Release --no-build --nologo --verbosity minimal --logger "trx;LogFileName=test-results.trx" *> test.log
          $testExitCode = $LASTEXITCODE
          Get-Content test.log
          exit $testExitCode

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-log-${{ matrix.os }}
          path: test.log
          if-no-files-found: ignore
          retention-days: 7
