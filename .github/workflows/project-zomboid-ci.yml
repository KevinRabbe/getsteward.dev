name: Project Zomboid adapter CI

on:
  push:
    branches:
      - main
    paths:
      - "src/SharedWorlds.GameAdapters/ProjectZomboid/**"
      - "tests/SharedWorlds.GameAdapters.ProjectZomboid.Tests/**"
      - ".github/workflows/project-zomboid-ci.yml"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "NuGet.config"
  pull_request:
    paths:
      - "src/SharedWorlds.GameAdapters/ProjectZomboid/**"
      - "tests/SharedWorlds.GameAdapters.ProjectZomboid.Tests/**"
      - ".github/workflows/project-zomboid-ci.yml"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "NuGet.config"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test Project Zomboid adapter
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore tests/SharedWorlds.GameAdapters.ProjectZomboid.Tests/SharedWorlds.GameAdapters.ProjectZomboid.Tests.csproj

      - name: Test
        shell: pwsh
        run: |
          dotnet test tests/SharedWorlds.GameAdapters.ProjectZomboid.Tests/SharedWorlds.GameAdapters.ProjectZomboid.Tests.csproj --configuration Release --no-restore --nologo --verbosity minimal 2>&1 | Tee-Object -FilePath project-zomboid-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-zomboid-test-log
          path: project-zomboid-test.log
