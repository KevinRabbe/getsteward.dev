name: Closed alpha live backend deployment CI

on:
  pull_request:
  push:
    branches:
      - "agent/**"

permissions:
  contents: read

jobs:
  deployment:
    name: Prove staged exact-image backend deployment boundary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install disposable SSH server
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server

      - name: Run live backend deployment integration rehearsal
        shell: pwsh
        run: ./tools/test-closed-alpha-live-backend-deployment.ps1
