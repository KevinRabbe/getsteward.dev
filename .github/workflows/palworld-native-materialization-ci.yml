name: Palworld native materialization probe CI

on:
  push:
    branches:
      - "agent/palworld-runtime-overlay"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build native materialization probe
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore tools/SharedWorlds.PalworldNativeSettingsMaterializationProbe/SharedWorlds.PalworldNativeSettingsMaterializationProbe.csproj

      - name: Build
        shell: pwsh
        run: |
          dotnet build tools/SharedWorlds.PalworldNativeSettingsMaterializationProbe/SharedWorlds.PalworldNativeSettingsMaterializationProbe.csproj --configuration Release --no-restore --nologo --verbosity normal 2>&1 | Tee-Object -FilePath native-materialization-build.log
          $code = $LASTEXITCODE
          exit $code

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-materialization-build-log
          path: native-materialization-build.log
          if-no-files-found: error
