name: Windows acceptance package

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
  workflow_dispatch:
    inputs:
      friends_api_base_url:
        description: "Optional real HTTPS Steward backend URL for a downloadable Friends Build artifact"
        required: false
        type: string
      friends_version:
        description: "Friends Build package version"
        required: false
        default: "2.0.0-alpha.1"
        type: string
      steam_api_base_url:
        description: "Optional real HTTPS Steward backend URL for a downloadable Steam depot-content artifact"
        required: false
        type: string
      steam_app_id:
        description: "Expected Steward Steam AppID for the depot-content artifact"
        required: false
        type: string
      steam_web_api_identity:
        description: "GetAuthTicketForWebApi service identity for the depot-content artifact"
        required: false
        type: string
      steam_version:
        description: "Steam release-candidate product version"
        required: false
        default: "3.0.0-alpha.1"
        type: string

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  package:
    name: Build Windows acceptance package
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test Windows Desktop resource boundary
        shell: pwsh
        run: |
          $results = "$env:RUNNER_TEMP/desktop-resource-test-results"
          $log = "$env:RUNNER_TEMP/desktop-resource-test.log"
          New-Item -ItemType Directory -Force -Path $results | Out-Null
          & dotnet test `
            tests/SharedWorlds.Desktop.AcceptanceTests/SharedWorlds.Desktop.AcceptanceTests.csproj `
            --configuration Release `
            --nologo `
            --verbosity minimal `
            --logger "trx;LogFileName=desktop-resource-test.trx" `
            --results-directory $results *> $log
          $exitCode = $LASTEXITCODE
          Get-Content $log
          if ($exitCode -ne 0) {
            exit $exitCode
          }

      - name: Upload Desktop resource test diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: steward-desktop-resource-test-${{ github.sha }}
          path: |
            ${{ runner.temp }}/desktop-resource-test.log
            ${{ runner.temp }}/desktop-resource-test-results
          if-no-files-found: error
          retention-days: 14

      - name: Build byte-verifiable package
        shell: pwsh
        run: |
          ./tools/e4-build-desktop.ps1 `
            -FrameworkDependent `
            -OutputDirectory "$env:RUNNER_TEMP/steward-windows-acceptance"
          Get-Content "$env:RUNNER_TEMP/steward-windows-acceptance/acceptance-build.json"

      - name: Build and verify V3 Steam depot content
        shell: pwsh
        env:
          REQUESTED_STEAM_API_BASE_URL: ${{ github.event.inputs.steam_api_base_url }}
          REQUESTED_STEAM_APP_ID: ${{ github.event.inputs.steam_app_id }}
          REQUESTED_STEAM_WEB_API_IDENTITY: ${{ github.event.inputs.steam_web_api_identity }}
          REQUESTED_STEAM_VERSION: ${{ github.event.inputs.steam_version }}
        run: |
          $requestedApiBaseUrl = $env:REQUESTED_STEAM_API_BASE_URL
          $requestedAppId = $env:REQUESTED_STEAM_APP_ID
          $requestedIdentity = $env:REQUESTED_STEAM_WEB_API_IDENTITY
          $requestedVersion = $env:REQUESTED_STEAM_VERSION

          $hasApiBaseUrl = -not [string]::IsNullOrWhiteSpace($requestedApiBaseUrl)
          $hasAppId = -not [string]::IsNullOrWhiteSpace($requestedAppId)
          $hasIdentity = -not [string]::IsNullOrWhiteSpace($requestedIdentity)
          $providedCount = [int]$hasApiBaseUrl + [int]$hasAppId + [int]$hasIdentity

          if ($providedCount -eq 0) {
            $apiBaseUrl = 'https://steam-release.example.invalid/'
            [uint32]$appId = 123456789
            $identity = 'steward-ci'
            $version = '3.0.0-ci'
          }
          elseif ($providedCount -ne 3) {
            throw 'steam_api_base_url, steam_app_id, and steam_web_api_identity must be provided together.'
          }
          else {
            $apiBaseUrl = $requestedApiBaseUrl
            [uint32]$appId = 0
            if (-not [uint32]::TryParse($requestedAppId, [ref]$appId) -or $appId -eq 0) {
              throw 'steam_app_id must be a positive UInt32.'
            }
            $identity = $requestedIdentity
            $version = if ([string]::IsNullOrWhiteSpace($requestedVersion)) { '3.0.0-alpha.1' } else { $requestedVersion }
          }

          $apiUri = $null
          if (-not [Uri]::TryCreate($apiBaseUrl, [UriKind]::Absolute, [ref]$apiUri)) {
            throw 'steam_api_base_url must be an absolute URL.'
          }
          $expectedApiBaseUrl = $apiUri.AbsoluteUri
          if (-not $expectedApiBaseUrl.EndsWith('/', [StringComparison]::Ordinal)) {
            $expectedApiBaseUrl += '/'
          }

          $output = "$env:RUNNER_TEMP/steward-v3-steam-depot"
          $evidence = "$env:RUNNER_TEMP/steward-v3-steam-evidence"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $manifestPath = Join-Path $evidence 'acceptance-build.json'
          $backendAuthPath = Join-Path $evidence 'backend-steam-auth.public.json'

          ./tools/e4-build-desktop.ps1 `
            -OutputDirectory $output `
            -AcceptanceManifestOutputPath $manifestPath `
            -ReleaseContentOnly `
            -SteamReleaseApiBaseUrl $apiBaseUrl `
            -SteamReleaseAppId $appId `
            -SteamReleaseWebApiIdentity $identity `
            -BuildVersion $version

          $backendAuthConfiguration = [ordered]@{
            Steam__AppId = $appId.ToString([Globalization.CultureInfo]::InvariantCulture)
            Steam__Identity = $identity
            FriendsBuild__Enabled = 'false'
          }
          [IO.File]::WriteAllText(
            $backendAuthPath,
            ($backendAuthConfiguration | ConvertTo-Json -Compress),
            [Text.UTF8Encoding]::new($false))

          $configurationPath = Join-Path $output 'steward-steam-release.json'
          $managedDesktopPath = Join-Path $output 'SharedWorlds.Desktop.dll'
          if (-not [IO.File]::Exists($configurationPath) -or
              -not [IO.File]::Exists($manifestPath) -or
              -not [IO.File]::Exists($backendAuthPath) -or
              -not [IO.File]::Exists($managedDesktopPath)) {
            throw 'V3 Steam release staging is missing depot configuration, release evidence, backend auth configuration, or the Desktop binary.'
          }
          if ([IO.File]::Exists((Join-Path $output 'acceptance-build.json'))) {
            throw 'acceptance-build.json is release evidence and must stay outside Steam depot content.'
          }
          if ([IO.File]::Exists((Join-Path $output 'steward-friends-build.json'))) {
            throw 'V3 Steam depot content unexpectedly contains Friends Build routing.'
          }
          if ([IO.File]::Exists((Join-Path $output 'steam_appid.txt'))) {
            throw 'V3 Steam depot content must not ship steam_appid.txt.'
          }
          if (@(Get-ChildItem -LiteralPath $output -Recurse -File -Filter '*.pdb').Count -ne 0) {
            throw 'V3 Steam depot content must not ship PDB debug symbols.'
          }
          if ([IO.File]::Exists((Join-Path $output 'steam_api64.lib'))) {
            throw 'V3 Steam depot content must not ship the Steamworks import library.'
          }

          $productVersion = [Diagnostics.FileVersionInfo]::GetVersionInfo($managedDesktopPath).ProductVersion
          if (-not [string]::Equals($productVersion, $version, [StringComparison]::Ordinal)) {
            throw "Published Steward binary version '$productVersion' does not match requested Steam version '$version'."
          }

          $configuration = Get-Content -LiteralPath $configurationPath -Raw | ConvertFrom-Json
          $configurationProperties = @($configuration.PSObject.Properties.Name | Sort-Object)
          $expectedConfigurationProperties = @('apiBaseUrl', 'schemaVersion', 'steamAppId', 'steamWebApiIdentity') | Sort-Object
          if ($configurationProperties.Count -ne $expectedConfigurationProperties.Count -or
              @(Compare-Object $configurationProperties $expectedConfigurationProperties).Count -ne 0 -or
              $configuration.schemaVersion -ne 1 -or
              [string]$configuration.apiBaseUrl -ne $expectedApiBaseUrl -or
              [uint32]$configuration.steamAppId -ne $appId -or
              [string]$configuration.steamWebApiIdentity -ne $identity) {
            throw 'Generated V3 Steam release configuration is invalid or contains an unexpected field.'
          }

          $backendAuth = Get-Content -LiteralPath $backendAuthPath -Raw | ConvertFrom-Json
          $backendAuthProperties = @($backendAuth.PSObject.Properties.Name | Sort-Object)
          $expectedBackendAuthProperties = @('FriendsBuild__Enabled', 'Steam__AppId', 'Steam__Identity') | Sort-Object
          if ($backendAuthProperties.Count -ne $expectedBackendAuthProperties.Count -or
              @(Compare-Object $backendAuthProperties $expectedBackendAuthProperties).Count -ne 0 -or
              [uint32]$backendAuth.Steam__AppId -ne [uint32]$configuration.steamAppId -or
              -not [string]::Equals([string]$backendAuth.Steam__Identity, [string]$configuration.steamWebApiIdentity, [StringComparison]::Ordinal) -or
              -not [string]::Equals([string]$backendAuth.FriendsBuild__Enabled, 'false', [StringComparison]::Ordinal)) {
            throw 'Generated V3 backend Steam auth configuration does not exactly match the client release identity.'
          }

          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ([string]$manifest.runtime -ne 'win-x64' -or
              [string]$manifest.configuration -ne 'Release' -or
              $manifest.selfContained -ne $true) {
            throw 'V3 Steam depot evidence does not describe a self-contained Release win-x64 build.'
          }

          $actualFiles = @(Get-ChildItem -LiteralPath $output -Recurse -File | Sort-Object FullName)
          $manifestEntries = @($manifest.files)
          if ($actualFiles.Count -ne $manifestEntries.Count) {
            throw "Steam depot content contains $($actualFiles.Count) files but release evidence lists $($manifestEntries.Count)."
          }

          foreach ($file in $actualFiles) {
            $relativePath = [IO.Path]::GetRelativePath($output, $file.FullName).Replace('\', '/')
            $entries = @($manifestEntries | Where-Object { [string]$_.path -eq $relativePath })
            if ($entries.Count -ne 1) {
              throw "Steam depot file '$relativePath' is not represented exactly once in release evidence."
            }
            if ([int64]$entries[0].byteSize -ne $file.Length) {
              throw "Steam depot file '$relativePath' size does not match release evidence."
            }
            $actualHash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash
            if (-not [string]::Equals([string]$entries[0].sha256, $actualHash, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Steam depot file '$relativePath' SHA-256 does not match release evidence."
            }
          }

      - name: Build and verify V2 Friends Build ZIP
        shell: pwsh
        env:
          REQUESTED_FRIENDS_API_BASE_URL: ${{ github.event.inputs.friends_api_base_url }}
          REQUESTED_FRIENDS_VERSION: ${{ github.event.inputs.friends_version }}
        run: |
          $apiBaseUrl = $env:REQUESTED_FRIENDS_API_BASE_URL
          if ([string]::IsNullOrWhiteSpace($apiBaseUrl)) {
            $apiBaseUrl = 'https://friends-build.example.invalid/'
          }

          $version = $env:REQUESTED_FRIENDS_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = '2.0.0-ci'
          }

          ./tools/v2-build-friends.ps1 `
            -ApiBaseUrl $apiBaseUrl `
            -Version $version `
            -OutputDirectory "$env:RUNNER_TEMP/steward-v2-friends"

      - name: Verify Friends Build friend provisioning
        shell: pwsh
        run: |
          $configurationPath = "$env:RUNNER_TEMP/friend-provisioning.json"
          $credentialPath = "$env:RUNNER_TEMP/friend-provisioning.secret"
          ./tools/v2-provision-friend.ps1 `
            -DisplayName 'CI Friend' `
            -Index 0 `
            -ConfigurationOutputPath $configurationPath `
            -CredentialOutputPath $credentialPath `
            -Quiet

          $configuration = Get-Content -LiteralPath $configurationPath -Raw | ConvertFrom-Json
          $credential = [IO.File]::ReadAllText($credentialPath)
          if (-not $credential.StartsWith('st_friend_', [StringComparison]::Ordinal) -or $credential.Length -ne 53) {
            throw 'Provisioned Friends Build credential has the wrong format.'
          }

          $credentialBytes = [Text.Encoding]::UTF8.GetBytes($credential)
          try {
            $actualDigest = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($credentialBytes))
          }
          finally {
            [Security.Cryptography.CryptographicOperations]::ZeroMemory($credentialBytes)
          }

          $expectedDigest = [string]$configuration.PSObject.Properties['FriendsBuild__Identities__0__CredentialSha256'].Value
          if (-not [string]::Equals($actualDigest, $expectedDigest, [StringComparison]::Ordinal)) {
            throw 'Provisioned Friends Build credential does not match the backend digest.'
          }
          if ([string]$configuration.FriendsBuild__Enabled -ne 'true' -or
              [string]$configuration.PSObject.Properties['FriendsBuild__Identities__0__DisplayName'].Value -ne 'CI Friend' -or
              -not ([string]$configuration.PSObject.Properties['FriendsBuild__Identities__0__Id'].Value).StartsWith('friend-', [StringComparison]::Ordinal)) {
            throw 'Provisioned Friends Build backend configuration is invalid.'
          }

          $configurationText = [IO.File]::ReadAllText($configurationPath)
          if ($configurationText.Contains($credential, [StringComparison]::Ordinal)) {
            throw 'Plaintext Friends Build credential leaked into backend configuration.'
          }

          Remove-Item -LiteralPath $credentialPath -Force

      - name: Upload exact acceptance package
        uses: actions/upload-artifact@v6
        with:
          name: steward-windows-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/steward-windows-acceptance
          if-no-files-found: error
          retention-days: 14

      - name: Upload downloadable Steam depot content
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.steam_api_base_url != '' && github.event.inputs.steam_app_id != '' && github.event.inputs.steam_web_api_identity != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: steward-v3-steam-depot-${{ github.event.inputs.steam_version }}
          path: ${{ runner.temp }}/steward-v3-steam-depot
          if-no-files-found: error
          retention-days: 14

      - name: Upload Steam depot release evidence
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.steam_api_base_url != '' && github.event.inputs.steam_app_id != '' && github.event.inputs.steam_web_api_identity != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: steward-v3-steam-depot-evidence-${{ github.event.inputs.steam_version }}
          path: ${{ runner.temp }}/steward-v3-steam-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Upload downloadable Friends Build artifact
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.friends_api_base_url != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: steward-v2-friends-${{ github.event.inputs.friends_version }}
          path: |
            ${{ runner.temp }}/steward-v2-friends/*.zip
            ${{ runner.temp }}/steward-v2-friends/*.sha256
          if-no-files-found: error
          retention-days: 14
