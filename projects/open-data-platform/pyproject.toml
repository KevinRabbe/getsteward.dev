[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-data-platform-v01"
version = "0.23.0"
description = "Verified open-data archive, historical backfill, semantic changes, distributions, quality intelligence, and independent commercial product candidates"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
parquet = ["pyarrow==25.0.0"]

[project.scripts]
odp = "open_data_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
