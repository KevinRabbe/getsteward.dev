name: Closed alpha external ingress acceptance CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  external-ingress-acceptance:
    name: Prove HTTPS trust and externally closed backend port from separate network namespace
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install external-observer dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends caddy ca-certificates curl iproute2 python3
          caddy version
          curl --version

      - name: Run separate-network external ingress acceptance rehearsal
        shell: pwsh
        run: |
          $logPath = "$env:RUNNER_TEMP/external-ingress-acceptance.log"
          try {
            ./tools/test-closed-alpha-external-ingress.ps1 *>&1 |
              Tee-Object -FilePath $logPath
          }
          catch {
            ($_ | Out-String) | Tee-Object -FilePath $logPath -Append | Write-Host
            throw
          }

      - name: Upload bounded failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: external-ingress-acceptance-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/external-ingress-acceptance.log
          if-no-files-found: error
          retention-days: 2
