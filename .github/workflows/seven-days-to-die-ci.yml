name: 7 Days to Die adapter CI

on:
  push:
    branches:
      - "agent/steward-unblocked-work"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test 7 Days to Die adapter
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore tests/SharedWorlds.GameAdapters.SevenDaysToDie.Tests/SharedWorlds.GameAdapters.SevenDaysToDie.Tests.csproj

      - name: Test
        run: dotnet test tests/SharedWorlds.GameAdapters.SevenDaysToDie.Tests/SharedWorlds.GameAdapters.SevenDaysToDie.Tests.csproj --configuration Release --no-restore --nologo --verbosity minimal
