name: Peer product CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peer-product-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  quality:
    name: Peer product quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore peer product
        run: dotnet restore SharedWorlds.PeerProduct.slnf

      - name: Verify peer product formatting
        shell: pwsh
        run: |
          $projects = @(
            'src/SharedWorlds.Core/SharedWorlds.Core.csproj',
            'src/SharedWorlds.Infrastructure/SharedWorlds.Infrastructure.csproj',
            'src/SharedWorlds.Desktop/SharedWorlds.Desktop.csproj',
            'tests/SharedWorlds.Core.Tests/SharedWorlds.Core.Tests.csproj',
            'tests/SharedWorlds.Infrastructure.Tests/SharedWorlds.Infrastructure.Tests.csproj'
          )
          foreach ($project in $projects) {
            & dotnet format $project --verify-no-changes --no-restore --verbosity minimal
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  build-test:
    name: Peer product build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore peer product
        run: dotnet restore SharedWorlds.PeerProduct.slnf

      - name: Build peer product
        run: dotnet build SharedWorlds.PeerProduct.slnf --configuration Release --no-restore --nologo --verbosity minimal

      - name: Test peer product
        run: dotnet test SharedWorlds.PeerProduct.slnf --configuration Release --no-build --no-restore --nologo --verbosity minimal

      - name: Validate ordinary Windows package
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          ./tools/e4-build-desktop.ps1 `
            -FrameworkDependent `
            -OutputDirectory "$env:RUNNER_TEMP/steward-peer-product"
          Get-Content "$env:RUNNER_TEMP/steward-peer-product/acceptance-build.json"

          if (Test-Path "$env:RUNNER_TEMP/steward-peer-product/steward-steam-release.json") {
            throw 'Ordinary peer product package unexpectedly contains legacy remote configuration.'
          }
          if (Test-Path "$env:RUNNER_TEMP/steward-peer-product/steward-friends-build.json") {
            throw 'Ordinary peer product package unexpectedly contains Friends Build backend routing.'
          }
