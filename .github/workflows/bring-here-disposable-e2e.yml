name: Bring Here disposable end-to-end

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Source publication to target materialization
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: steward_bring_here_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d steward_bring_here_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Start disposable S3-compatible service
        shell: bash
        run: |
          docker run --detach --rm \
            --name steward-bring-here-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:latest \
            server /data --address :9000

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker logs steward-bring-here-minio
          exit 1

      - name: Restore disposable Bring Here acceptance
        run: dotnet restore tests/SharedWorlds.BringHere.EndToEndTests/SharedWorlds.BringHere.EndToEndTests.csproj --nologo

      - name: Test exact source-to-target path
        env:
          STEWARD_BRING_HERE_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=steward_bring_here_e2e;Username=postgres;Password=postgres;Pooling=false
          STEWARD_BRING_HERE_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          STEWARD_BRING_HERE_TEST_S3_REGION: us-east-1
          STEWARD_BRING_HERE_TEST_S3_ACCESS_KEY: minioadmin
          STEWARD_BRING_HERE_TEST_S3_SECRET_KEY: minioadmin
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/SharedWorlds.BringHere.EndToEndTests/SharedWorlds.BringHere.EndToEndTests.csproj \
            --configuration Release \
            --no-restore \
            --nologo \
            --logger "console;verbosity=normal" \
            2>&1 | tee "$RUNNER_TEMP/bring-here-e2e-test.log"

      - name: Upload end-to-end test log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bring-here-disposable-e2e-log-${{ github.sha }}
          path: ${{ runner.temp }}/bring-here-e2e-test.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop disposable S3-compatible service
        if: always()
        shell: bash
        run: docker stop steward-bring-here-minio || true
