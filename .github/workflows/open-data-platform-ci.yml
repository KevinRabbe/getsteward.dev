name: Open Data Platform CI

on:
  push:
    paths:
      - "projects/open-data-platform/**"
      - ".github/workflows/open-data-platform-ci.yml"
  pull_request:
    paths:
      - "projects/open-data-platform/**"
      - ".github/workflows/open-data-platform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-data-platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"

    defaults:
      run:
        working-directory: projects/open-data-platform

    env:
      PYTHONPATH: src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Python version
        run: python --version

      - name: Compile
        run: python -m compileall -q .

      - name: Offline tests
        run: python -m unittest discover -s tests -v

      - name: Launcher smoke
        shell: bash
        run: |
          python odp.py --help
          python production_acceptance.py --help
          python historical_changes.py --help
          python gleif_relationships.py --help
          python build_distribution.py --help
          python quality_intelligence.py --help
          python commercial_product.py --help
          python ror_registry.py --help
          python ror_commercial_product.py --help
          python commercial_readiness.py --help

      - name: PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path .\scripts -Filter *.ps1 | ForEach-Object {
            [void][ScriptBlock]::Create((Get-Content -LiteralPath $_.FullName -Raw))
          }

      - name: Diff whitespace check
        working-directory: .
        run: git diff --check

  parquet:
    name: Parquet / ${{ matrix.os }} / Python 3.11
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    defaults:
      run:
        working-directory: projects/open-data-platform

    env:
      PYTHONPATH: src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned optional Parquet engine
        run: python -m pip install --disable-pip-version-check pyarrow==25.0.0

      - name: Parquet distribution tests
        run: python -m unittest discover -s tests -p "test_distributions.py" -v

  diagnostic-unittest-log:
    name: Diagnostic unittest log
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projects/open-data-platform

    env:
      PYTHONPATH: src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Capture offline test output
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > unittest.log 2>&1
          printf '%s\n' "$?" > unittest.exit
          exit 0

      - name: Upload unittest output
        uses: actions/upload-artifact@v4
        with:
          name: open-data-platform-unittest-diagnostic
          path: |
            projects/open-data-platform/unittest.log
            projects/open-data-platform/unittest.exit
          if-no-files-found: error
