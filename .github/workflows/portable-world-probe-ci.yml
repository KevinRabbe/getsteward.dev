name: Portable World acceptance probe CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-world-probe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  probe:
    name: Build and smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore probe
        run: dotnet restore tools/SharedWorlds.PortableWorldProbe/SharedWorlds.PortableWorldProbe.csproj

      - name: Verify probe formatting
        shell: pwsh
        run: dotnet format tools/SharedWorlds.PortableWorldProbe/SharedWorlds.PortableWorldProbe.csproj --verify-no-changes --no-restore

      - name: Build probe
        run: dotnet build tools/SharedWorlds.PortableWorldProbe/SharedWorlds.PortableWorldProbe.csproj --configuration Release --no-restore --nologo --verbosity minimal

      - name: Smoke help path
        run: dotnet run --project tools/SharedWorlds.PortableWorldProbe/SharedWorlds.PortableWorldProbe.csproj --configuration Release --no-build -- --help
